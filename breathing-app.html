<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="description" content="Professional breathing app with 12 scientifically-backed breathing techniques for relaxation, focus, and energy">
    <meta name="keywords" content="breathing, meditation, mindfulness, stress relief, anxiety, focus, relaxation">
   <title>Breathe - Mindful Breathing App</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23ffc482'/></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <div class="main-content">
        <div class="header">
            <h1>Breathe</h1>
            <p></p>
            <p></p>
        </div>

        <div class="breathing-circle" id="breathingCircle">
            <div class="breath-text" id="breathText">Ready</div>
        </div>

        <div class="session-status" id="sessionStatus">
            <div class="status-grid">
                <div class="status-item">
                    <span class="status-value" id="statusTimer">5:00</span>
                    <div class="status-label">Time Left</div>
                </div>
                <div class="status-item">
                    <span class="status-value" id="statusCycles">1</span>
                    <div class="status-label">Cycles</div>
                </div>
                <div class="status-item">
                    <span class="status-value" id="statusPhase">Breathe Out</span>
                    <div class="status-label">Phase</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn primary" id="startBtn">Start Session</button>
            <button class="btn" id="pauseBtn" style="display: none;">Pause</button>
            <button class="btn" id="stopBtn" style="display: none;">Stop</button>
        </div>

        </div>
        
        <div class="sidebar">
            <h2>Breathing Techniques</h2>
            <div class="controls">
                <div class="technique-selector">
                    <select id="techniqueSelect">
                        <optgroup label="Relaxation & Sleep">
                            <option value="478">4-7-8 Breathing</option>
                            <option value="triangle">Triangle Breathing</option>
                            <option value="equal">Equal Breathing</option>
                            <option value="extended">Extended Exhale</option>
                            <option value="ocean">Ocean Breathing</option>
                        </optgroup>
                        <optgroup label="Focus & Concentration">
                            <option value="box">Box Breathing</option>
                            <option value="coherent">Coherent Breathing</option>
                            <option value="pranayama">Pranayama 4-16-8</option>
                            <option value="alternate">Alternate Nostril</option>
                        </optgroup>
                        <optgroup label="Energy & Activation">
                            <option value="wimhof">Wim Hof Method</option>
                            <option value="bellows">Bellows Breathing</option>
                        </optgroup>
                        <optgroup label="Custom">
                            <option value="custom">Custom Pattern</option>
                        </optgroup>
                    </select>
                </div>

                <div class="duration-controls">
                    <label>Session Duration:</label>
                    <input type="number" id="sessionDuration" value="5" min="1" max="60">
                    <span>minutes</span>
                </div>

                <div class="technique-info" id="techniqueInfo">
                    <h3 style="margin-bottom: 15px; font-weight: 400; text-align: center;">4-7-8 Breathing</h3>
                    <div class="technique-timing" id="techniquePattern">Inhale 4s → Hold 7s → Exhale 8s</div>
                    <div class="technique-benefits" id="techniqueBenefits"><strong>Benefits:</strong> Reduces anxiety, promotes sleep, lowers stress hormones</div>
                    <div class="technique-when" id="techniqueWhen">Best for: Evening wind-down, before sleep, anxiety relief</div>
                </div>

                <div class="custom-settings" id="customSettings">
                    <h3 style="margin-bottom: 15px; font-weight: 300;">Custom Pattern</h3>
                    <div class="custom-row">
                        <label>Inhale (seconds):</label>
                        <input type="number" id="customInhale" value="4" min="1" max="20">
                    </div>
                    <div class="custom-row">
                        <label>Inhale Hold (seconds):</label>
                        <input type="number" id="customInhaleHold" value="0" min="0" max="20">
                    </div>
                    <div class="custom-row">
                        <label>Exhale (seconds):</label>
                        <input type="number" id="customExhale" value="4" min="1" max="20">
                    </div>
                    <div class="custom-row">
                        <label>Exhale Hold (seconds):</label>
                        <input type="number" id="customExhaleHold" value="0" min="0" max="20">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Call app.js -->
    <script src="app.js"></script>
</body>
</html>
